# Docker 环境配置
server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: mall
  datasource:
    url: jdbc:mysql://mysql:3306/mall?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: redis
      port: 6379
      database: 0
      timeout: 5000ms
  jackson:
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.mall.module.*.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true

# JWT 配置（生产环境请务必修改密钥）
jwt:
  secret: mall-secret-key-2024-please-change-in-production-environment
  expiration: 86400000
  header: Authorization
  prefix: "Bearer "

mall:
  points-rate: 1
  order-timeout: 30
  page-size: 10

logging:
  level:
    com.mall: debug
    org.mybatis: debug
